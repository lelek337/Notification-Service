server:
  port: 9191

logging:
  config:
    classpath: log4j2.xml

db-schema: notification_service

project:
  version: @project.version@

spring:
  application:
    name: notification-service

  security:
    user:
      name: Ivan
      password: 1234

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:${REQUEST_PROCESSOR_DATABASE_URL:postgresql://localhost:5433/request_processor}?currentSchema=${db-schema}&ApplicationName=${spring.application.name}
    username: ${REQUEST_PROCESSOR_DATABASE_USERNAME:rp_user}
    password: ${REQUEST_PROCESSOR_DATABASE_PASSWORD:rp_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    open-in-view: false

  liquibase:
    change-log: db.changelog/changelog-master.xml
    default-schema: ${db-schema}

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: request_processor
      auto-offset-reset: earliest
      auto-commit-interval: 100ms
      session-timeout: 15000ms
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    retries:
      max-retries: 3
      interval-ms: 1000

    #        spring.json.add.type.headers: false
    topic:
      sms-events: sms-events
      email-events: email-events
      push-events: push-events
      telegram-events: telegram-events

scheduler:
  batch-size: 1
  timeout-ms: 12000
  cron: "2 * * * * *"

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
      show-details: always
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    url: /v3/api-docs


